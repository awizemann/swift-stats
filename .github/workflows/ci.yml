name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (macOS 15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  cloudflare-backend:
    name: Cloudflare backend (Worker + D1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backends/cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backends/cloudflare/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs against a local D1 inside workerd. No Cloudflare account, no login,
      # no network, and nothing is ever deployed from CI.
      - name: Conformance suite
        run: npm test
