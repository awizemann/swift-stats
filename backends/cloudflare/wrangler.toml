name = "stats-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# The Worker holds no secrets of its own: keys are stored *hashed* in D1
# (table `keys`), so a D1 read cannot recover a usable key and there is no
# `[vars]` or secret to rotate here. See README "Keys".

[[d1_databases]]
binding = "DB"
database_name = "stats"
# Replace with the id printed by `wrangler d1 create stats`.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Custom domain (optional). Wrangler creates the DNS record for you on deploy.
# The reference deployment is api.swiftstats.co; self-hosters set their own
# or delete this block and use the workers.dev URL.
# [[routes]]
# pattern = "api.swiftstats.co"
# custom_domain = true

[triggers]
# 02:10 UTC — comfortably after midnight UTC so "yesterday" is closed, and off
# the top of the hour where Cloudflare's cron fleet is busiest.
crons = ["10 2 * * *"]

[observability]
enabled = true

[observability.logs]
# Invocation logs are OFF: they record each request's URL (read query strings)
# and request metadata, which can include Cloudflare's IP-derived geography and
# custom headers such as X-Stats-Read-Key — contradicting README §10/§13 (no
# IP-derived data, no key in logs). The worker's own structured logger lines
# (key-only, closed field list) still reach Workers Logs.
invocation_logs = false
